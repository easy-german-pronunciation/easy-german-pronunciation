<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>জার্মান উচ্চারণ চেকার - Greetings</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .checker-card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 20px;
            padding: 30px 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            color: #1a252f;
            margin-bottom: 5px;
        }

        .score-board {
            font-size: 16px;
            color: #555;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .instruction {
            font-size: 15px;
            color: #666;
            margin-bottom: 15px;
        }

        .word-display {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .translation-display {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 25px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-listen {
            background-color: #2980b9;
            color: white;
        }

        .btn-listen:hover {
            background-color: #1c638e;
        }

        .btn-record {
            background-color: #27ae60;
            color: white;
        }

        .btn-record:hover {
            background-color: #1e8449;
        }

        .btn-record.recording {
            background-color: #e74c3c;
            animation: pulse 1.2s infinite;
        }

        .btn-next {
            background-color: #8e44ad;
            color: white;
            margin-top: 15px;
        }

        .btn-next:hover {
            background-color: #6c3483;
        }

        .feedback-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            display: none;
            text-align: left;
            font-size: 14px;
        }

        .feedback-box.correct {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .feedback-box.incorrect {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="checker-card">
    <h2 class="header-title">🇩🇪 জার্মান উচ্চারণ চেকার</h2>
    <div class="score-board">স্কোর: <span id="score">0</span> / <span id="total">0</span></div>

    <p class="instruction">নিচের বাক্যটি সঠিক জার্মানে উচ্চারণ করুন:</p>
    
    <div class="word-display" id="german-word">Hallo</div>
    <div class="translation-display" id="english-meaning">(Hello)</div>

    <button class="btn btn-listen" onclick="playAudio()">🔊 সঠিক উচ্চারণ শুনুন</button>
    <button class="btn btn-record" id="record-btn" onclick="startRecognition()">🎙️ উচ্চারণ রেকর্ড করুন</button>
    
    <div id="feedback" class="feedback-box"></div>

    <button class="btn btn-next" onclick="nextWord()">Next ➔</button>
</div>

<script>
    // খাতার ছবি থেকে নেওয়া সম্পূর্ণ ২৫টি শব্দার্থ ও উচ্চারণ গাইড
    const vocabularyList = [
        { german: "Hallo", english: "Hello", hint: "হাল্লো" },
        { german: "Guten Morgen", english: "Good morning", hint: "গুটেন মর্গেন" },
        { german: "Guten Tag", english: "Good day", hint: "গুটেন টাখ (g এর উচ্চারণ খ-এর মতো)" },
        { german: "Guten Abend", english: "Good evening", hint: "গুটেন আবেন্দ" },
        { german: "Gute Nacht", english: "Good night", hint: "গুটো নাখট" },
        { german: "Auf Wiedersehen", english: "Goodbye / See you again", hint: "আউফ ভিডারজেহেন (W = V এর মতো)" },
        { german: "Auf Wiederhören", english: "Goodbye (telephone)", hint: "আউফ ভিডারহোরেন" },
        { german: "Tschüss", english: "Bye", hint: "চুস" },
        { german: "Bis später", english: "See you later", hint: "বিস শপেটার" },
        { german: "Bis Morgen", english: "See you tomorrow", hint: "বিস মর্গেন" },
        { german: "Bis bald", english: "Until soon", hint: "বিস বাল্ড" },
        { german: "Wie geht es Ihnen?", english: "How are you? (formal)", hint: "ভি গেট এস ইহেনেন?" },
        { german: "Wie geht's?", english: "How are you? (informal)", hint: "ভি গেটস?" },
        { german: "Gut", english: "Good", hint: "গুট" },
        { german: "Schlecht", english: "Bad", hint: "শলেখট" },
        { german: "Es geht", english: "I'm ok", hint: "এস গেট" },
        { german: "Gleichfalls", english: "Likewise / Same to you", hint: "গ্লাইখফালস" },
        { german: "Wie heißen Sie?", english: "What's your name? (formal)", hint: "ভি হাইসেন জি?" },
        { german: "Wie heißt du?", english: "What's your name? (informal)", hint: "ভি হাইস্ট দু?" },
        { german: "Ich heiße Niko", english: "My name is Nico", hint: "ইখ হাইসে নিকো" },
        { german: "Woher kommen Sie?", english: "Where do you come from? (formal)", hint: "ভোহের খমেন জি?" },
        { german: "Woher kommst du?", english: "Where do you come from? (informal)", hint: "ভোহের খমস্ট দু?" },
        { german: "Ich komme aus BD", english: "I came from BD", hint: "ইখ খমে আউস বাংলাদেশ" }
    ];

    let currentIndex = 0;
    let score = 0;

    const wordEl = document.getElementById('german-word');
    const meaningEl = document.getElementById('english-meaning');
    const scoreEl = document.getElementById('score');
    const totalEl = document.getElementById('total');
    const feedbackEl = document.getElementById('feedback');
    const recordBtn = document.getElementById('record-btn');

    totalEl.textContent = vocabularyList.length;

    function loadWord() {
        const current = vocabularyList[currentIndex];
        wordEl.textContent = current.german;
        meaningEl.textContent = `(${current.english})`;
        feedbackEl.style.display = "none";
    }

    function playAudio() {
        const current = vocabularyList[currentIndex];
        const utterance = new SpeechSynthesisUtterance(current.german);
        utterance.lang = 'de-DE';
        utterance.rate = 0.8;
        window.speechSynthesis.speak(utterance);
    }

    function startRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert("আপনার ব্রাউজারে ভয়েস সাপোর্ট নেই। Google Chrome ব্যবহার করুন।");
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'de-DE';
        recognition.interimResults = false;

        recordBtn.classList.add('recording');
        recordBtn.textContent = "🎙️ শুনছি... বলুন!";

        recognition.start();

        recognition.onresult = function(event) {
            recordBtn.classList.remove('recording');
            recordBtn.textContent = "🎙️ উচ্চারণ রেকর্ড করুন";

            const spokenText = event.results[0][0].transcript.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");
            const targetText = vocabularyList[currentIndex].german.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "");

            checkPronunciation(spokenText, targetText);
        };

        recognition.onerror = function() {
            recordBtn.classList.remove('recording');
            recordBtn.textContent = "🎙️ উচ্চারণ রেকর্ড করুন";
            showFeedback(false, "কথা পরিষ্কার বোঝা যায়নি, আবার চেষ্টা করুন!");
        };

        recognition.onspeechend = function() {
            recognition.stop();
            recordBtn.classList.remove('recording');
            recordBtn.textContent = "🎙️ উচ্চারণ রেকর্ড করুন";
        };
    }

    function checkPronunciation(spoken, target) {
        if (spoken === target || target.includes(spoken) || spoken.includes(target)) {
            score++;
            scoreEl.textContent = score;
            showFeedback(true, `<b>সঠিক হয়েছে! 🎉</b><br>আপনি বলেছেন: "<i>${spoken}</i>"`);
        } else {
            const current = vocabularyList[currentIndex];
            showFeedback(false, `
                <b>ভুল হয়েছে! ❌</b><br>
                আপনি বলেছেন: "<i>${spoken}</i>"<br>
                <b>সাজেশন:</b> উচ্চারণ করার সময় খেয়াল রাখুন -> <b>${current.hint}</b>
            `);
        }
    }

    function showFeedback(isCorrect, message) {
        feedbackEl.style.display = "block";
        feedbackEl.className = "feedback-box " + (isCorrect ? "correct" : "incorrect");
        feedbackEl.innerHTML = message;
    }

    function nextWord() {
        if (currentIndex < vocabularyList.length - 1) {
            currentIndex++;
            loadWord();
        } else {
            alert(`অভিনন্দন! আপনি সবগুলো অনুশীলন শেষ করেছেন। আপনার স্কোর: ${score}/${vocabularyList.length}`);
            currentIndex = 0;
            score = 0;
            scoreEl.textContent = score;
            loadWord();
        }
    }

    loadWord();
</script>

</body>
</html>
